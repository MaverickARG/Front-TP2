<!DOCTYPE html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animaciones suaves adicionales */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        .delay-1 { animation-delay: 0.1s; opacity: 0; }
        .delay-2 { animation-delay: 0.2s; opacity: 0; }
        .delay-3 { animation-delay: 0.3s; opacity: 0; }
    </style>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100 font-sans flex flex-col items-center justify-center p-6 selection:bg-blue-500 selection:text-white">

        <div class="absolute -top-20 -left-20 w-40 h-40 bg-blue-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20"></div>

            <h2 class="text-lg font-medium text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 mb-3">TRABAJO PRÁCTICO INDIVIDUAL 2</h2>
            <p class="text-sm text-gray-400 font-medium tracking-wide uppercase">Adrian Madroñal - Comision Lunes</p>

                <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-blue-500 to-blue-600 opacity-0 group-hover:opacity-10 rounded-2xl transition-opacity duration-300"></div>

    <!-- Footer -->
    <footer class="mt-8 text-sm text-gray-500 fade-in delay-3">
        Desarrollo Front End &copy; 2026
    </footer>

</body>
</html>
